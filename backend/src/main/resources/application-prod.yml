# 生产环境配置
# 生产关闭 Swagger/OpenAPI，避免接口与 DTO 全量暴露
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  auth:
    # ⚠️ 测试模式：按当前联调要求默认开启，放开初始口令并跳过管理端角色校验。
    # 正式上线前必须设 APP_AUTH_TEST_MODE=false（或删除本行，回落到 application.yml 的默认值）。
    test-mode: ${APP_AUTH_TEST_MODE:true}
  wechat:
    # 默认 false；仅测试服可显式设 APP_WECHAT_SKIP_API=true 以启用 dev_ 免密登录。
    # ⚠️ 生产必须保持 false，true 时任何人可用 dev_ 前缀伪造微信身份。
    skip-api: ${APP_WECHAT_SKIP_API:false}
  payment:
    # 生产禁用模拟支付：保证金必须经微信支付或物业线下确认收款（fail-closed，此处再显式声明一次）
    mock-enabled: ${APP_PAYMENT_MOCK_ENABLED:false}

wechat:
  pay:
    # 生产默认关闭分账标识；确需分账时显式置 WECHAT_PAY_PROFIT_SHARING=true（fail-closed）
    profit-sharing: ${WECHAT_PAY_PROFIT_SHARING:false}

# 分账链路总开关：生产默认关闭，避免「未确认业务口径即自动分账划款」
wechat-split:
  enabled: ${WECHAT_SPLIT_ENABLED:false}
  auto-withdraw-enabled: ${WECHAT_SPLIT_AUTO_WITHDRAW_ENABLED:false}

# 结构管理现状（2026-09 决策）：
# - Flyway 暂不启用：存量生产库由 wuye_points_latest.sql 导入，与迁移脚本对不齐，启用会触发 DDL 冲突。
# - 结构变更走「手工执行 db/migration 下编号脚本 + 部署清单」流程，ddl-auto=none 防止启动期误自动改表。
# - 后续若要恢复 Flyway：先对存量库执行一次性 flyway baseline（版本=当前结构），再置 enabled=true。
spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
