# 物业积分服务系统 — 本地/演示/单机部署编排
# 用法：
#   1. cp .env.example .env  并填好真实值
#   2. docker compose up -d --build
#
# 生产环境建议：
#   - MySQL 使用托管实例或独立有备份的容器，并挂持久卷 + 定期备份
#   - 在容器前加 Nginx 反代做 TLS(HTTPS) + HSTS + 全局限流
#   - 多实例时引入 Redis（当前限流/状态为内存级，仅单实例有效）

services:
  mysql:
    image: mysql:8.0
    container_name: wuye-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-wuye_points}
      TZ: Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 注意：这里【不】自动挂载 SQL 初始化脚本。
      # 原因：wuye_points_full_latest.sql 含 DROP TABLE，若误对现有库执行会清表。
      # 初始化新库请手动执行一次：
      #   mysql -h<host> -u<user> -p<password> wuye_points < wuye_points_full_latest.sql
      # 应用本身 ddl-auto=validate，启动不会自动建/改/删任何表。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.ci
    container_name: wuye-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-wuye_points}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WECHAT_MP_APP_ID: ${WECHAT_MP_APP_ID}
      WECHAT_MP_APP_SECRET: ${WECHAT_MP_APP_SECRET}
      APP_WECHAT_SKIP_API: ${APP_WECHAT_SKIP_API:-false}
      UPLOAD_PATH: ${UPLOAD_PATH:-/data/uploads}
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      MACHINE_ID: ${MACHINE_ID:-1}
      RATE_LIMIT_MAX_ATTEMPTS: ${RATE_LIMIT_MAX_ATTEMPTS:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-300000}
      # 生产默认开启真实微信支付；未填商户参数时由代码 isConfigured() 守卫拒绝发起，不会误收款
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-true}
      # 微信支付凭据：必须逐项透传，否则容器内 isConfigured() 恒为 false，所有支付被 fail-closed 拒绝。
      # 私钥二选一：PRIVATE_KEY_BASE64（推荐，无文件依赖）或 PRIVATE_KEY_PATH（需与 ./backend/cert 挂载路径一致）。
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_PRIVATE_KEY_BASE64: ${WECHAT_PAY_PRIVATE_KEY_BASE64:-}
      WECHAT_PAY_MERCHANT_SERIAL_NUMBER: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:-}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-wxf7230afd38275659}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL:-}
      WECHAT_PAY_PLATFORM_SUB_MCH_ID: ${WECHAT_PAY_PLATFORM_SUB_MCH_ID:-}
      WECHAT_PAY_SUB_MCH_IDS: ${WECHAT_PAY_SUB_MCH_IDS:-}
      WECHAT_PAY_ACCOUNT_TYPE: ${WECHAT_PAY_ACCOUNT_TYPE:-BASIC}
      WECHAT_PAY_WITHDRAW_NOTIFY_URL: ${WECHAT_PAY_WITHDRAW_NOTIFY_URL:-}
      WECHAT_PAY_RECEIVER_RELATION_TYPE: ${WECHAT_PAY_RECEIVER_RELATION_TYPE:-SERVICE_PROVIDER}
      WECHAT_PAY_RECEIVER_CUSTOM_RELATION: ${WECHAT_PAY_RECEIVER_CUSTOM_RELATION:-}
      # 分账开关必须显式透传；应用内与编排均 fail-closed 默认 false。
      # 微信商户平台开通「分账」并添加分账接收方后，在 .env 置 true 即可启用。
      WECHAT_PAY_PROFIT_SHARING: ${WECHAT_PAY_PROFIT_SHARING:-false}
      WECHAT_SPLIT_ENABLED: ${WECHAT_SPLIT_ENABLED:-false}
      # 是否允许用户主动发起订单退款（fail-closed 默认 false）
      WECHAT_SPLIT_USER_REFUND_ENABLED: ${WECHAT_SPLIT_USER_REFUND_ENABLED:-false}
      # 归集户余额监控阈值（元），留空=不监控
      WECHAT_SPLIT_COLLECT_ALERT_THRESHOLD: ${WECHAT_SPLIT_COLLECT_ALERT_THRESHOLD:-}
      # 自动提现开关（fail-closed 默认 false）。
      # 生效范围：仅「电商收付通」模式有真实资金动作；「普通分账」模式下收款方需自行在微信商户平台提现，
      # 开启本开关仅推进本地状态位 withdraw_status，不代表平台自动打款。
      WECHAT_SPLIT_AUTO_WITHDRAW_ENABLED: ${WECHAT_SPLIT_AUTO_WITHDRAW_ENABLED:-false}
      # 模拟支付开关：生产必须为 false，否则任何人可零成本获得保证金/食堂额度
      APP_PAYMENT_MOCK_ENABLED: ${APP_PAYMENT_MOCK_ENABLED:-false}
      # 微信 API 超时（毫秒）
      WECHAT_PAY_CONNECT_TIMEOUT_MS: ${WECHAT_PAY_CONNECT_TIMEOUT_MS:-5000}
      WECHAT_PAY_READ_TIMEOUT_MS: ${WECHAT_PAY_READ_TIMEOUT_MS:-20000}
      # 欠费催缴微信订阅消息（留空则跳过微信推送，回退应用内消息）
      WECHAT_ARREARS_TEMPLATE_ID: ${WECHAT_ARREARS_TEMPLATE_ID:-}
      WECHAT_ARREARS_PAGE_PATH: ${WECHAT_ARREARS_PAGE_PATH:-}
      # 快递员分成核算口径：true=走配送费（B 方案），false=四档分成含快递（A 方案）
      WUYE_DIST_COURIER_DELIVERY: ${WUYE_DIST_COURIER_DELIVERY:-true}
      # Flyway：默认关闭；prod profile 内另硬编码 false（生产恒不启用），故此变量仅对非 prod profile 生效
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      # ===== 电商收付通（wechat-ecommerce，与 wechat-split 互斥，以本开关为准）=====
      WECHAT_ECOMMERCE_ENABLED: ${WECHAT_ECOMMERCE_ENABLED:-false}
      WECHAT_ECOMMERCE_PLATFORM_RECEIVER_MCH_ID: ${WECHAT_ECOMMERCE_PLATFORM_RECEIVER_MCH_ID:-}
      WECHAT_ECOMMERCE_PLATFORM_SUB_MCH_ID: ${WECHAT_ECOMMERCE_PLATFORM_SUB_MCH_ID:-}
      WECHAT_ECOMMERCE_RECEIVER_RELATION_TYPE: ${WECHAT_ECOMMERCE_RECEIVER_RELATION_TYPE:-SERVICE_PROVIDER}
      WECHAT_ECOMMERCE_APPLYMENT_AUTO_SUBMIT: ${WECHAT_ECOMMERCE_APPLYMENT_AUTO_SUBMIT:-false}
      WECHAT_ECOMMERCE_TRANSFER_CHANNEL: ${WECHAT_ECOMMERCE_TRANSFER_CHANNEL:-zero}
      # 以下三个回调地址须为公网 HTTPS，默认值与应用内 yml 保持一致（改默认值需同时改 yml）
      WECHAT_ECOMMERCE_NOTIFY_URL: ${WECHAT_ECOMMERCE_NOTIFY_URL:-https://test.yuanxusoftware.top/api/v1/payment/ecommerce-split/notify}
      WECHAT_ECOMMERCE_APPLYMENT_NOTIFY_URL: ${WECHAT_ECOMMERCE_APPLYMENT_NOTIFY_URL:-https://test.yuanxusoftware.top/api/v1/payment/ecommerce-applyment/notify}
      WECHAT_ECOMMERCE_TRANSFER_NOTIFY_URL: ${WECHAT_ECOMMERCE_TRANSFER_NOTIFY_URL:-https://test.yuanxusoftware.top/api/v1/payment/ecommerce-transfer/notify}
    ports:
      - "8888:8888"
    volumes:
      - uploads:/data/uploads
      - ./backend/cert:/opt/wuye-points/cert:ro

volumes:
  mysql-data:
  uploads:
